<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись на тренировку</title>

    <style>
        :root {
            /* Новая светлая палитра (как на лендинге) */
            --color-bg: #FDF9F5;
            --color-text: #3E2F29;
            --color-text-secondary: #6F5950;
            --color-primary: #875744;
            --color-primary-hover: #6B4132;
            --color-surface: #ffffff;
            --color-border: #E8D3C7;
            --radius: 12px;
            --error: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--color-text);
        }

        header p {
            color: var(--color-text-secondary);
            font-size: 16px;
        }

        .card {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 4px 20px rgba(45, 39, 39, 0.05);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-secondary);
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        select {
            width: 100%;
            min-height: 48px;
            background: #FAFAFA;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--color-text);
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            box-sizing: border-box;
            -webkit-appearance: none;
            appearance: none;
        }

        input:focus,
        select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(156, 108, 87, 0.1);
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 12px;
            min-height: 84px;
        }

        .slot-btn {
            background: #FDF9F5;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 10px;
            color: var(--color-text);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .slot-btn:hover:not(:disabled) {
            background: #F5EAE1;
            border-color: var(--color-primary);
        }

        .slot-btn.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
            box-shadow: 0 4px 10px rgba(156, 108, 87, 0.2);
        }

        .slot-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #F5F5F5;
        }

        .btn-submit {
            width: 100%;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover:not(:disabled) {
            background: var(--color-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(139, 101, 98, 0.2);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 84px;
            text-align: center;
            padding: 18px;
            color: var(--color-text-secondary);
            background: var(--color-bg);
            border: 1px dashed var(--color-border);
            border-radius: 8px;
            line-height: 1.45;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.2);
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Запись на тренировку</h1>
            <p>Выберите удобное время и оставьте контакты</p>
        </header>

        <div id="booking-form-container">
            <div class="card">
                <div class="form-group">
                    <label for="trainer-select">Выберите тренера</label>
                    <select id="trainer-select" required style="margin-bottom: 16px;">
                        <option value="" disabled selected>Загрузка...</option>
                    </select>
                </div>

                <div class="form-group" id="date-group" style="display: none;">
                    <label for="date-select">Выберите дату</label>
                    <input type="date" id="date-select" required>
                </div>

                <div class="form-group" id="time-group" style="display: none;">
                    <label>Доступное время</label>
                    <div id="slots-container" class="slots-grid">
                        <div class="loading">Сначала выберите дату — здесь появится свободное время</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <!-- Honeypot: скрыто CSS-смещением, живой пользователь не видит и не трогает -->
                <div style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
                    <label for="client-website">Website</label>
                    <input type="text" id="client-website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="client-name">Ваше имя</label>
                    <input type="text" id="client-name" placeholder="Имя Фамилия" required>
                </div>
                <div class="form-group">
                    <label for="client-phone">Номер телефона</label>
                    <input type="tel" id="client-phone" placeholder="+7 (900) 000-00-00" required>
                </div>
                <div class="form-group">
                    <label for="contact-method">Удобный способ связи</label>
                    <select id="contact-method" required style="margin-bottom: 16px;">
                        <option value="" disabled selected>Выберите способ связи</option>
                        <option value="Telegram">Telegram</option>
                        <option value="MAX">MAX</option>
                        <option value="Позвонить">Позвонить</option>
                    </select>
                </div>

                <button class="btn-submit" id="btn-submit" disabled>Записаться</button>
                <div id="status-message" class="message"></div>
            </div>
        </div>

        <div id="success-container" style="display: none; text-align: center; margin-top: 40px;">
            <div style="font-size: 64px; color: var(--success); margin-bottom: 16px;">✓</div>
            <h2 style="color: var(--color-text);">Заявка отправлена!</h2>
            <p style="color: var(--color-text-secondary); margin-top: 8px;">Ожидайте подтверждения записи тренером. Мы
                свяжемся с вами выбранным способом.</p>
            <div id="success-details"
                style="margin-top: 24px; padding: 16px; background: var(--color-surface); border-radius: 8px; border: 1px solid var(--color-border); color: var(--color-text);">
            </div>
            <button class="btn-submit" style="margin-top: 24px;" onclick="window.location.reload()">Хорошо</button>
        </div>
    </div>

    <script src="/clients/static/js/public_booking.js?v=7"></script>
</body>

</html>
