# Properly handle WebSocket upgrades vs regular HTTP keepalive.
# When $http_upgrade is empty (normal HTTP), use "keep-alive"; when it's
# "websocket", use "upgrade". This prevents Connection: upgrade from being
# sent on regular API calls, which would break HTTP keepalive and cause
# iOS Safari to hang on subsequent requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      keep-alive;
}

server {
    listen 80;
    server_name fit-nch.ru www.fit-nch.ru localhost;

    # ================================================
    # ЛЕНДИНГ — корень сайта
    # ================================================
    location = / {
        root /usr/share/nginx/html/landing;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        root /usr/share/nginx/html/landing;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root /usr/share/nginx/html/landing;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Never expose hidden files if one is accidentally added to the web root.
    location ~ /\. {
        deny all;
    }

    # ================================================
    # PUBLIC BOOKING
    # ================================================
    location /book {
        proxy_pass http://planner_service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 10;
        proxy_send_timeout 60;
    }

    location /api/public {
        proxy_pass http://planner_service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 10;
        proxy_send_timeout 60;
    }

    # Planner documents and assets are served directly by nginx. This avoids an
    # unnecessary proxy hop through FastAPI and keeps mobile resource delivery
    # predictable. Only API and non-static frontend routes are proxied below.
    location = /planner {
        root /usr/share/nginx/html/planner;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /planner/ {
        root /usr/share/nginx/html/planner;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /clients {
        root /usr/share/nginx/html/planner;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /clients/ {
        root /usr/share/nginx/html/planner;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /clients/static/ {
        alias /usr/share/nginx/html/planner/;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /clients/manifest.json {
        alias /usr/share/nginx/html/planner/manifest.json;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /clients/sw.js {
        alias /usr/share/nginx/html/planner/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Fallback for any future /planner subroutes.
    location /planner {
        proxy_pass http://planner_service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 10;
        proxy_send_timeout 60;
    }

    # ================================================
    # PLANNER PWA — /clients
    # ================================================
    location /clients {
        proxy_pass http://planner_service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support: Connection header is "upgrade" only for WS,
        # "keep-alive" for regular HTTP (via the map above).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60;
        proxy_connect_timeout 10;
        proxy_send_timeout 60;
    }

    # ================================================
    # BOT WEBHOOKS
    # ================================================
    location /webhook {
        proxy_pass http://bot_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 10;
        proxy_send_timeout 60;
    }

    # ================================================
    # Security headers
    # ================================================
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
}
